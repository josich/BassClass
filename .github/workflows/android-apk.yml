# Builds the BassClass Android app on every push to main and publishes it as a
# GitHub Release. Install link (open it on the phone):
#   https://github.com/<user>/<repo>/releases/latest/download/BassClass.apk
# It also builds the Google Play bundle (the `play` flavour): unsigned on a push, as a check that it builds and asks
# for no network permission; signed with the upload key when run by hand (Actions → Build Android APK → Run
# workflow), then kept for 7 days as the artifact BassClass-play-aab, to upload in the Play Console (LAUNCH-TODO.md).
# Never rename this file: the version code is its run number, and Google Play needs it to grow.
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # create releases; commit the signing key on the very first run

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # First run only: create one permanent signing key and commit it, so every
      # later build is signed the same way and installs as an update.
      - name: Create signing key (first run only)
        run: |
          if [ ! -f android/app/bassclass.p12 ]; then
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore android/app/bassclass.p12 \
              -alias bassclass -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass bassclass -keypass bassclass -dname "CN=BassClass, O=josich"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/bassclass.p12
            git commit -m "Add app signing key (generated by CI) [skip ci]"
            git push
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # the app shows its release number at the bottom of Settings
      - name: Stamp the version into the web app
        run: |
          echo "export const VERSION = '1.0.${{ github.run_number }}';" > web/js/version.js
          echo "export const COMMIT = '${GITHUB_SHA::7}';" >> web/js/version.js
          cat web/js/version.js

      - name: Build signed release APK
        run: |
          gradle -p android assembleGithubRelease
          cp android/app/build/outputs/apk/github/release/app-github-release.apk BassClass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BassClass-apk
          path: BassClass.apk
          retention-days: 7

      # The Google Play bundle. A run started by hand signs it with the upload key (the four PLAY_UPLOAD_* secrets) and
      # needs the developer's legal name and address in web/js/legal.js (the privacy policy's controller); a push only
      # checks that it builds. Either way: no internet, network-state or advertising-ID permission (the privacy policy
      # and the Data safety form say so), Google Play's billing permission present, no native code (16 KB pages).
      - name: Build the Google Play bundle
        env:
          SIGN: ${{ github.event_name == 'workflow_dispatch' }}
          KS_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ "$SIGN" = "true" ]; then
            if [ -z "$KS_B64" ]; then echo "::error::The PLAY_UPLOAD_* secrets are missing (LAUNCH-TODO.md: the upload key)"; exit 1; fi
            if grep -q "OWNER = { name: '', address: '' }" web/js/legal.js; then
              echo "::error::Fill in the legal name and address in web/js/legal.js (OWNER) before building for Google Play"; exit 1
            fi
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.p12"
          fi
          # (the developer tools and the self-test are not part of the Play app)
          rm -rf web/js/dev web/js/selftest.js
          gradle -p android bundlePlayRelease
          rm -f "$RUNNER_TEMP/upload.p12"
          AAB=android/app/build/outputs/bundle/playRelease/app-play-release.aab
          ls -l "$AAB"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/manifest.pb"
          for p in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE com.google.android.gms.permission.AD_ID; do
            if grep -aq "$p" "$RUNNER_TEMP/manifest.pb"; then echo "::error::The Play bundle asks for $p"; exit 1; fi
          done
          grep -aq "com.android.vending.BILLING" "$RUNNER_TEMP/manifest.pb" || { echo "::error::The Play bundle lacks com.android.vending.BILLING"; exit 1; }
          if unzip -l "$AAB" | grep -q '\.so$'; then echo "::error::The Play bundle holds native code"; exit 1; fi
          if [ "$SIGN" = "true" ]; then
            jarsigner -verify "$AAB" > /dev/null || { echo "::error::The Play bundle is not signed"; exit 1; }
            if keytool -printcert -jarfile "$AAB" | grep -q "O=josich"; then echo "::error::The Play bundle is signed with the public test key"; exit 1; fi
          fi
          echo "Play bundle checked: no network permission, billing present, no native code."

      - name: Check the GitHub APK's permissions
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)aapt2"
          if [ ! -x "$AAPT2" ]; then echo "::warning::aapt2 not found: the APK's permissions were not checked"; exit 0; fi
          "$AAPT2" dump permissions BassClass.apk
          if "$AAPT2" dump permissions BassClass.apk | grep -q "android.permission.INTERNET"; then echo "::error::The APK asks for INTERNET"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: BassClass-play-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BassClass 1.0.${{ github.run_number }}
          make_latest: true
          files: BassClass.apk
          body: |
            **Install on Android:** open this link on your phone, download, then open the file:
            https://github.com/${{ github.repository }}/releases/latest/download/BassClass.apk

            Updates install over the previous version and keep your progress.
            Built from ${{ github.sha }}.
