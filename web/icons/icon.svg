<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BassClass icon: a glossy green note dot with a bass (F) clef carved into it.
       PNG sizes are rendered from this file by web/js/dev/iconprep.js. -->
  <defs>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#a8f9df"/>
      <stop offset="0.28" stop-color="#3fd6a8"/>
      <stop offset="0.66" stop-color="#17a47b"/>
      <stop offset="1" stop-color="#0b5e47"/>
    </radialGradient>
    <radialGradient id="bounce" cx="0.5" cy="1.05" r="0.55">
      <stop offset="0" stop-color="#b9ffe9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b9ffe9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <!-- bass clef in a 100-unit box, placed in the middle of the dot -->
    <g id="clef">
      <circle cx="30" cy="42" r="8.5"/>
      <path d="M22.5 40 C23 24 40 15 54 18 C68 21 74 34 72 47 C70 62 56 76 27 90 C26.2 90.3 25.6 89.4 26.4 88.8 C47 76 58 64 60 49 C61.5 37 57 26 47 25.5 C38 25 31.5 31 31 37 Z"/>
      <circle cx="81" cy="33" r="5.6"/>
      <circle cx="81" cy="52" r="5.6"/>
    </g>
    <!-- carve: the recess walls catch shadow at the top-left and light at the bottom-right -->
    <mask id="wallShadow" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <g filter="url(#soft)">
        <use href="#placed" fill="#fff"/>
        <use href="#placed" fill="#000" transform="translate(7 8)"/>
      </g>
    </mask>
    <mask id="wallLight" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <g filter="url(#soft)">
        <use href="#placed" fill="#fff"/>
        <use href="#placed" fill="#000" transform="translate(-5 -6)"/>
      </g>
    </mask>
    <mask id="lip" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <use href="#placed" fill="#fff" transform="translate(2.5 3)"/>
      <use href="#placed" fill="#000"/>
    </mask>
    <g id="placed" transform="translate(96 100) scale(2.95)"><use href="#clef"/></g>
    <clipPath id="dot"><circle cx="256" cy="256" r="244"/></clipPath>
  </defs>

  <g clip-path="url(#dot)">
    <circle cx="256" cy="256" r="244" fill="url(#body)"/>
    <!-- light bouncing back from below, and a darker band at the very edge -->
    <circle cx="256" cy="256" r="244" fill="url(#bounce)"/>
    <circle cx="256" cy="256" r="236" fill="none" stroke="#073d2f" stroke-opacity="0.5" stroke-width="22" filter="url(#softer)"/>

    <!-- the carved clef: recess floor, shadowed and lit walls, and a bright lip on the lower edge -->
    <use href="#placed" fill="#137355"/>
    <rect width="512" height="512" fill="#062b21" fill-opacity="0.75" mask="url(#wallShadow)"/>
    <rect width="512" height="512" fill="#c9ffee" fill-opacity="0.55" mask="url(#wallLight)"/>
    <rect width="512" height="512" fill="#e6fff7" fill-opacity="0.7" mask="url(#lip)"/>

    <!-- reflections: a broad soft window highlight and a small sharp glint -->
    <ellipse cx="196" cy="138" rx="132" ry="74" transform="rotate(-24 196 138)" fill="url(#spec)"/>
    <ellipse cx="160" cy="118" rx="34" ry="16" transform="rotate(-30 160 118)" fill="#fff" fill-opacity="0.8" filter="url(#soft)"/>
  </g>
  <circle cx="256" cy="256" r="243" fill="none" stroke="#0d4637" stroke-opacity="0.55" stroke-width="3"/>
</svg>
