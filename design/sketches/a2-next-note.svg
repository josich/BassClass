<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <!-- Designer's spec sketch (round 2), not app art: concept A simplified to the app's signature moment.
       A teal root on the A string, a dashed arc pointing to the next note, the gold 5th two frets up on
       the D string (R-5). No frets, two markers. 108-unit adaptive canvas, layered like the
       candidates (#art > #bg, #fg; #mono). -->
  <defs>
    <clipPath id="tile"><rect x="18" y="18" width="72" height="72" rx="16"/></clipPath>
    <linearGradient id="sky" x1="18" y1="18" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a9af2"/><stop offset="0.5" stop-color="#5a8fd6"/><stop offset="1" stop-color="#3fc19c"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="27" x2="0" y2="81" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2f5e"/><stop offset="0.5" stop-color="#1b1f42"/><stop offset="1" stop-color="#252a55"/>
    </linearGradient>
    <linearGradient id="str" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6f88"/><stop offset="0.38" stop-color="#f4f5fb"/><stop offset="0.62" stop-color="#c7cad8"/><stop offset="1" stop-color="#585c70"/>
    </linearGradient>
    <radialGradient id="teal" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#8ad8c1"/><stop offset="0.55" stop-color="#3fc19c"/><stop offset="1" stop-color="#2d8b70"/></radialGradient>
    <radialGradient id="gold" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#ecd0a2"/><stop offset="0.55" stop-color="#dba85a"/><stop offset="1" stop-color="#9e7941"/></radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <mask id="gaps" maskUnits="userSpaceOnUse" x="-60" y="-60" width="228" height="228">
      <rect x="-60" y="-60" width="228" height="228" fill="#fff"/>
      <g fill="#000"><rect x="24.2" y="48" width="25" height="25" rx="7.5"/><circle cx="71.3" cy="47.5" r="11.5"/></g>
    </mask>
    <clipPath id="safe"><circle cx="54" cy="54" r="30"/></clipPath>
  </defs>

  <g id="art" clip-path="url(#tile)">
    <g id="bg"><rect width="108" height="108" fill="url(#sky)"/></g>
    <g id="fg" transform="rotate(-20 54 54)">
      <rect x="-60" y="30" width="228" height="54" fill="#0b0d22" fill-opacity="0.45" filter="url(#blur)"/>
      <rect x="-60" y="27" width="228" height="54" fill="url(#board)"/>
      <rect x="-60" y="27" width="228" height="0.8" fill="#4d5599"/>
      <!-- strings G D A E at .045/.065/.085/.105 proportions -->
      <g fill="url(#str)"><rect x="-60" y="33.7" width="228" height="1.6"/><rect x="-60" y="46.35" width="228" height="2.3"/><rect x="-60" y="59" width="228" height="3"/><rect x="-60" y="71.65" width="228" height="3.7"/></g>
      <!-- the next-note arc -->
      <path d="M40.5 47.6 Q49 27 61.4 42.6" fill="none" stroke="#eef0fd" stroke-width="3" stroke-linecap="round" stroke-dasharray="4.2 3.6"/>
      <g stroke="#fff" stroke-width="1.3">
        <rect x="26.2" y="50" width="21" height="21" rx="6" fill="url(#teal)"/>
        <circle cx="71.3" cy="47.5" r="9.5" fill="url(#gold)"/>
      </g>
    </g>
  </g>

  <g id="mono" display="none" fill="#000">
    <g transform="rotate(-20 54 54)">
      <g clip-path="url(#safe)"><g mask="url(#gaps)"><rect x="-60" y="33.3" width="228" height="2.4"/><rect x="-60" y="46.2" width="228" height="2.6"/><rect x="-60" y="58.9" width="228" height="3.2"/><rect x="-60" y="71.6" width="228" height="3.8"/></g></g>
      <path d="M40.5 47.6 Q49 27 61.4 42.6" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="5 3.6"/>
      <rect x="26.2" y="50" width="21" height="21" rx="6"/>
      <circle cx="71.3" cy="47.5" r="9.5"/>
    </g>
  </g>
</svg>
