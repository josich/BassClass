<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <!-- Concept B2 "Clef on strings, aurora": concept B in navy on the periwinkle-to-teal gradient, for a
       bright tile with strong value contrast. 108-unit adaptive canvas. -->
  <defs>
    <clipPath id="tile"><rect x="18" y="18" width="72" height="72" rx="16"/></clipPath>
    <linearGradient id="sky" x1="18" y1="18" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a9af2"/><stop offset="0.5" stop-color="#5a9dd8"/><stop offset="1" stop-color="#46c9a2"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="18%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <g id="clef">
      <circle cx="30" cy="42" r="8.5"/>
      <path d="M22.5 40 C23 24 40 15 54 18 C68 21 74 34 72 47 C70 62 56 76 27 90 C26.2 90.3 25.6 89.4 26.4 88.8 C47 76 58 64 60 49 C61.5 37 57 26 47 25.5 C38 25 31.5 31 31 37 Z"/>
      <circle cx="81" cy="33" r="5.6"/>
      <circle cx="81" cy="52" r="5.6"/>
    </g>
    <mask id="gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <rect width="108" height="108" fill="#fff"/>
      <use href="#clef" transform="translate(17.03 18.43) scale(0.684)" fill="#000" stroke="#000" stroke-width="4.4" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g id="art" clip-path="url(#tile)">
    <g id="bg">
      <rect width="108" height="108" fill="url(#sky)"/>
      <rect width="108" height="108" fill="url(#sheen)"/>
    </g>
    <g id="fg">
      <g fill="#12142a" fill-opacity="0.55" mask="url(#gaps)"><rect y="33.8" width="108" height="1.5"/><rect y="46.4" width="108" height="2.2"/><rect y="59.1" width="108" height="2.8"/><rect y="71.8" width="108" height="3.4"/></g>
      <use href="#clef" transform="translate(17.03 18.43) scale(0.684)" fill="#12142a"/>
    </g>
  </g>

  <g id="mono" display="none" fill="#000">
    <g mask="url(#gaps)"><rect y="33.2" width="108" height="2.6"/><rect y="46" width="108" height="3"/><rect y="58.9" width="108" height="3.2"/><rect y="71.7" width="108" height="3.6"/></g>
    <use href="#clef" transform="translate(17.03 18.43) scale(0.684)"/>
  </g>
</svg>
