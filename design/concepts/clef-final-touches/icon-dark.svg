<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <!-- DESIGNER PROPOSAL (design/reports/2026-10-22-app-icon-clef.md), not the shipped file.
       web/icons/icon-dark.svg with the same craft fixes as clef-final-touches/icon.svg; the rim light's
       side stops are stronger (0.4 / 0.32) so the navy tile keeps an edge on dark surfaces. -->
  <defs>
    <clipPath id="tile"><rect x="18" y="18" width="72" height="72" rx="16"/></clipPath>
    <linearGradient id="base" x1="0" y1="18" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3798"/><stop offset="0.5" stop-color="#0e1348"/><stop offset="1" stop-color="#0e1a66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5edab9" stop-opacity="0.72"/><stop offset="0.25" stop-color="#5edab9" stop-opacity="0.72"/><stop offset="0.4" stop-color="#46c9a2" stop-opacity="0.55"/><stop offset="1" stop-color="#46c9a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="18" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/><stop offset="1" stop-color="#fff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0" y1="18" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.4"/><stop offset="0.75" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="7" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a2f7dd"/><stop offset="1" stop-color="#36c299"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <!-- the clef in a 100-unit box: head, curl, the two dots -->
    <g id="clef">
      <circle cx="27" cy="36" r="12"/>
      <path d="M15.5 33 C16 17 30 7 46 7 C64 7 77 20 77 39 C77 61 57 81 19 97.3 C46 80 57 62 57 41 C57 25 51 16.5 44 16.5 C36.5 16.5 31.5 20 29.5 25 Z"/>
      <circle cx="87" cy="23" r="7"/>
      <circle cx="87" cy="49" r="7"/>
    </g>
  </defs>

  <g id="art" clip-path="url(#tile)">
    <g id="bg">
      <rect width="108" height="108" fill="url(#base)"/>
      <ellipse cx="54" cy="98" rx="42" ry="32" fill="url(#glow)"/>
    </g>
    <g id="fg">
      <!-- the clef sits a little inside the glass -->
      <g transform="translate(26.3 29.9) scale(0.55)" fill="#04051a" opacity="0.5" filter="url(#soft)"><use href="#clef"/></g>
      <g transform="translate(26.3 28.1) scale(0.55)" fill="url(#ink)"><use href="#clef"/></g>
      <!-- the reflection across the top -->
      <path d="M0 0 H108 V40.9 L90 36 C68 30 40 34 18 46 L0 55.8 Z" fill="url(#shine)" opacity="0.5"/>
    </g>
  </g>
  <g id="rim">
    <rect x="19.375" y="19.375" width="69.25" height="69.25" rx="14.625" fill="none" stroke="url(#rimLight)" stroke-width="1.25"/>
    <rect x="18.375" y="18.375" width="71.25" height="71.25" rx="15.625" fill="none" stroke="#02031a" stroke-opacity="0.5" stroke-width="0.75"/>
  </g>

  <g id="mono" display="none" fill="#000">
    <g transform="translate(26.3 28.1) scale(0.55)"><use href="#clef"/></g>
  </g>
</svg>
