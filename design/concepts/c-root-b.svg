<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <!-- Concept C "Root B": the app's root marker (a rounded square) as a big key on the strings, carrying
       a bold B: the note B and BassClass's initial. 108-unit adaptive canvas. -->
  <defs>
    <clipPath id="tile"><rect x="18" y="18" width="72" height="72" rx="16"/></clipPath>
    <linearGradient id="night" x1="0" y1="18" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d3369"/><stop offset="1" stop-color="#121430"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#46c9a2" stop-opacity="0.38"/><stop offset="1" stop-color="#46c9a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="str" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5f7e"/><stop offset="0.38" stop-color="#e9ebf8"/><stop offset="0.62" stop-color="#b8bcd6"/><stop offset="1" stop-color="#4c5070"/>
    </linearGradient>
    <radialGradient id="teal" cx="34%" cy="26%" r="85%">
      <stop offset="0" stop-color="#97ecd2"/><stop offset="0.5" stop-color="#46c9a2"/><stop offset="1" stop-color="#2a8f71"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <path id="b" fill-rule="evenodd" d="M45 42 H55.3 A5.7 5.7 0 0 1 55.3 53.4 H56.7 A6.3 6.3 0 0 1 56.7 66 H45 Z M50.6 46.4 H53.9 A2.5 2.5 0 0 1 53.9 51.4 H50.6 Z M50.6 55.4 H55.1 A3.1 3.1 0 0 1 55.1 61.6 H50.6 Z"/>
    <mask id="gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <rect width="108" height="108" fill="#fff"/>
      <rect x="31" y="31" width="46" height="46" rx="10" fill="#000"/>
    </mask>
  </defs>

  <g id="art" clip-path="url(#tile)">
    <g id="bg">
      <rect width="108" height="108" fill="url(#night)"/>
      <circle cx="54" cy="56" r="36" fill="url(#glow)"/>
    </g>
    <g id="fg">
      <g fill="url(#str)"><rect y="32.3" width="108" height="1.4"/><rect y="46" width="108" height="2"/><rect y="59.7" width="108" height="2.6"/><rect y="73.4" width="108" height="3.2"/></g>
      <rect x="34" y="36.5" width="40" height="40" rx="8.4" fill="#05060f" fill-opacity="0.55" filter="url(#blur)"/>
      <rect x="34" y="34" width="40" height="40" rx="8.4" fill="url(#teal)" stroke="#fff" stroke-width="2"/>
      <use href="#b" fill="#12142a"/>
    </g>
  </g>

  <g id="mono" display="none" fill="#000">
    <g mask="url(#gaps)"><rect y="31.8" width="108" height="2.4"/><rect y="45.6" width="108" height="2.8"/><rect y="59.4" width="108" height="3.2"/><rect y="73.2" width="108" height="3.6"/></g>
    <path fill-rule="evenodd" d="M42.4 34 H65.6 A8.4 8.4 0 0 1 74 42.4 V65.6 A8.4 8.4 0 0 1 65.6 74 H42.4 A8.4 8.4 0 0 1 34 65.6 V42.4 A8.4 8.4 0 0 1 42.4 34 Z M45 42 H55.3 A5.7 5.7 0 0 1 55.3 53.4 H56.7 A6.3 6.3 0 0 1 56.7 66 H45 Z M50.6 46.4 H53.9 A2.5 2.5 0 0 1 53.9 51.4 H50.6 Z M50.6 55.4 H55.1 A3.1 3.1 0 0 1 55.1 61.6 H50.6 Z"/>
  </g>
</svg>
